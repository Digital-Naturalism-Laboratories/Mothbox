# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"

  # Rebuild daily so the vendor list on "Get a Mothbox" picks up changes from
  # the Open Science Shop's Airtable (and refreshes expiring image URLs).
  schedule:
    - cron: "17 4 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
          working-directory: '${{ github.workspace }}/docs'
      # Vendor list for docs/get_a_mothbox, generated from the Open Science
      # Shop's "Mothbox Vendor Directory" Airtable table (same approach as
      # openflexure.org/about/vendors). Needs three repository secrets:
      #   OSS_BASE_ID, OSS_TABLE_ID, OSS_ACCESS_TOKEN
      # If they're missing or the fetch fails, the rest of the site still
      # deploys and the page shows a link to the shop's directory instead.
      - name: Generate vendor list from Open Science Shop
        continue-on-error: true
        env:
          OSS_BASE_ID: ${{ secrets.OSS_BASE_ID }}
          OSS_TABLE_ID: ${{ secrets.OSS_TABLE_ID }}
          OSS_ACCESS_TOKEN: ${{ secrets.OSS_ACCESS_TOKEN }}
        run: |
          if [ -z "$OSS_ACCESS_TOKEN" ]; then
            echo "::warning::OSS_* secrets not set; skipping Airtable vendor list"
            exit 0
          fi
          python3 -m pip install --quiet pyyaml requests
          ./generate_vendors.py "$OSS_BASE_ID" "$OSS_TABLE_ID" "$OSS_ACCESS_TOKEN"
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/_site/"

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
